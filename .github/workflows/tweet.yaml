name: Tweet
on:
  schedule:
    - cron:  '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Tweet
        env:
          TELEGRAM_TOKEN: ${{secrets.TELEGRAM_TOKEN}}
          TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_CHAT_ID}}
          CONSUMER_KEY: ${{secrets.CONSUMER_KEY}}
          CONSUMER_SECRET: ${{secrets.CONSUMER_SECRET}}
          ACCESS_KEY: ${{secrets.ACCESS_KEY}}
          ACCESS_SECRET: ${{secrets.ACCESS_SECRET}}
          BEARER_TOKEN: ${{secrets.BEARER_TOKEN}}
          MASTODON_ACCESS_TOKEN: ${{secrets.MASTODON_ACCESS_TOKEN}}
          MASTODON_BASE_URL: ${{secrets.MASTODON_BASE_URL}}
          MASTODON_USER_ID: ${{secrets.MASTODON_USER_ID}}
        run: uv run --no-dev python hypb/tweet_progress.py

      - name: Alert on failure
        if: failure()
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Job failed :(
            https://github.com/aviadlevy/hebrew-year-process-bot/actions/workflows/tweet.yaml
