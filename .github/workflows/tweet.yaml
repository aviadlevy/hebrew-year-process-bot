name: Tweet
on:
  # Retired 2026-08-19: the daily post now runs from a systemd timer on the
  # host at the same instant (the host is UTC, so OnCalendar=*-*-* 07:00:00
  # matches the cron below). See docs/deployment.md §9.
  # The workflow is deliberately kept, not deleted: workflow_dispatch is the
  # manual fallback for posting if the host is unavailable, and re-enabling
  # the schedule is the documented rollback.
  # schedule:
  #   - cron:  '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Tweet
        env:
          TELEGRAM_TOKEN: ${{secrets.TELEGRAM_TOKEN}}
          TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_CHAT_ID}}
          CONSUMER_KEY: ${{secrets.CONSUMER_KEY}}
          CONSUMER_SECRET: ${{secrets.CONSUMER_SECRET}}
          ACCESS_KEY: ${{secrets.ACCESS_KEY}}
          ACCESS_SECRET: ${{secrets.ACCESS_SECRET}}
          BEARER_TOKEN: ${{secrets.BEARER_TOKEN}}
          MASTODON_ACCESS_TOKEN: ${{secrets.MASTODON_ACCESS_TOKEN}}
          MASTODON_BASE_URL: ${{secrets.MASTODON_BASE_URL}}
          MASTODON_USER_ID: ${{secrets.MASTODON_USER_ID}}
          # The runner is ephemeral and unprivileged: without this the store
          # would try to create /var/lib/hypb and raise PermissionError. An
          # empty file per run means every run seeds from the Mastodon
          # timeline -- exactly what this workflow did before the store existed.
          STATE_DB_PATH: ${{ runner.temp }}/hypb-state.db
        run: uv run --no-dev python hypb/tweet_progress.py

      - name: Alert on failure
        if: failure()
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Job failed :(
            https://github.com/aviadlevy/hebrew-year-process-bot/actions/workflows/tweet.yaml
