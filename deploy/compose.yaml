services:
  mastodon-replier:
    image: ghcr.io/aviadlevy/hebrew-year-process-bot:${IMAGE_TAG:?set IMAGE_TAG in .env}
    container_name: hypb-mastodon-replier
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Jerusalem
      STATE_DB_PATH: /var/lib/hypb/state.db
    volumes:
      # The mention cursor lives beside the progress post's state. The volume is
      # created once by hand (docs/deployment.md section 9) and owned by uid 10001.
      - hypb-state:/var/lib/hypb
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hypb-state:
    external: true
